name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0). Leave empty to build artifacts only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-amd64
            ext: .exe
          - os: ubuntu-latest
            artifact: linux-amd64
            ext: ""
          - os: macos-latest
            artifact: macos-arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project + PyInstaller
        run: |
          uv sync --group release
          uv pip install pyinstaller

      - name: Build unified binary
        shell: bash
        run: |
          set -euo pipefail
          # One onefile binary: GUI (default) / course / single-file via launcher.
          # console=True so CLI modes work; GUI hides the console on Windows.
          uv run pyinstaller \
            --noconfirm --clean --onefile --name "smart-convert" \
            --collect-all customtkinter \
            scripts/pyi_smart_convert.py

      - name: Stage release folder
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/smart_convert_nvenc-${{ matrix.artifact }}"
          mkdir -p "$OUT"
          cp dist/smart-convert${{ matrix.ext }} "$OUT/"
          cp README.md LICENSE "$OUT/"
          chmod +x scripts/fetch_ffmpeg.sh
          scripts/fetch_ffmpeg.sh "${{ matrix.artifact }}" "$OUT"
          printf '%s\n' \
            '# smart_convert_nvenc release binary' \
            '' \
            'STATUS: early project — this binary is EXPERIMENTAL and not meaningfully tested.' \
            'The supported / working way to run is from source (git clone + uv sync + uv run).' \
            'Use this zip at your own risk until that disclaimer is removed from the docs.' \
            '' \
            '## Usage (single smart-convert binary)' \
            '' \
            '- Double-click / `smart-convert` — GUI' \
            '- `smart-convert course [opts]` — courses inbox → outbox' \
            '- `smart-convert video.mp4 [opts]` — one file' \
            '- `smart-convert --help` — overview' \
            '' \
            '## FFmpeg' \
            '' \
            '- Windows / Linux zips INCLUDE BtbN GPL FFmpeg n8.1 under ffmpeg/bin/ (not master tip).' \
            '- macOS zip does NOT bundle FFmpeg (install your own and put it on PATH).' \
            '- FFmpeg is GPL; see ffmpeg/SOURCE.txt and any LICENSE files beside it.' \
            '- NVIDIA GPU + driver still required for NVENC (AV1 encode typically needs RTX 40-series).' \
            '- GUI needs a desktop session (Windows / macOS / Linux with Tk).' \
            '' \
            '## Layout' \
            '' \
            '- `smart-convert` (+ `.exe` on Windows)' \
            '- `ffmpeg/bin/` — bundled ffmpeg + ffprobe (Win/Linux)' \
            '' \
            'NVENC itself is Windows/Linux with NVIDIA; macOS builds are for packaging compatibility but encode still needs FFmpeg+NVENC hardware where available.' \
            > "$OUT/README-RELEASE.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart_convert_nvenc-${{ matrix.artifact }}
          path: dist/smart_convert_nvenc-${{ matrix.artifact }}/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Zip platform bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          for dir in release-assets/smart_convert_nvenc-*; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "../../upload/${name}.zip" .)
          done
          ls -lah upload

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          body: |
            **Early project:** standalone binary is **experimental and not meaningfully tested**. Prefer running **from source** (`uv sync` / `uv run`). Use these zips at your own risk.

            **One binary:** `smart-convert` — GUI (default) / `course` / single file.

            **Windows / Linux:** FFmpeg (BtbN GPL **n8.1**) under `ffmpeg/bin/`.
            **macOS:** install FFmpeg yourself (not bundled).

            NVIDIA GPU + driver still required for NVENC.

            See `README-RELEASE.txt` inside each zip.
          files: upload/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
