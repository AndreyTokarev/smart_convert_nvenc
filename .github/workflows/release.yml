name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0). Leave empty to build artifacts only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-amd64
            ext: .exe
          - os: ubuntu-latest
            artifact: linux-amd64
            ext: ""
          - os: macos-latest
            artifact: macos-arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project + PyInstaller
        run: |
          uv sync --group release
          uv pip install pyinstaller

      - name: Build CLI binaries
        shell: bash
        run: |
          set -euo pipefail
          uv run pyinstaller \
            --noconfirm --clean --onefile --name "smart-convert" \
            scripts/pyi_smart_convert.py
          uv run pyinstaller \
            --noconfirm --clean --onefile --name "smart-convert-course" \
            scripts/pyi_smart_convert_course.py
          uv run pyinstaller \
            --noconfirm --clean --onefile --windowed \
            --name "smart-convert-gui" \
            --collect-all customtkinter \
            scripts/pyi_smart_convert_gui.py

      - name: Stage release folder
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/smart_convert_nvenc-${{ matrix.artifact }}"
          mkdir -p "$OUT"
          cp dist/smart-convert${{ matrix.ext }} "$OUT/"
          cp dist/smart-convert-course${{ matrix.ext }} "$OUT/"
          cp dist/smart-convert-gui${{ matrix.ext }} "$OUT/"
          cp README.md LICENSE "$OUT/"
          printf '%s\n' \
            '# smart_convert_nvenc release binaries' \
            '' \
            'These are standalone builds of the CLI/GUI entrypoints.' \
            '' \
            '## Requirements' \
            '' \
            '- FFmpeg with `hevc_nvenc` and `av1_nvenc` must be installed and on PATH.' \
            '- NVIDIA GPU + driver for NVENC (AV1 encode typically needs RTX 40-series).' \
            '- GUI needs a desktop session (Windows / macOS / Linux with Tk).' \
            '' \
            '## Binaries' \
            '' \
            '- `smart-convert` — single file' \
            '- `smart-convert-course` — course inbox/outbox pipeline' \
            '- `smart-convert-gui` — desktop UI' \
            '' \
            'NVENC itself is Windows/Linux with NVIDIA; macOS builds are for CLI/GUI packaging compatibility but encode still needs FFmpeg+NVENC hardware where available.' \
            > "$OUT/README-RELEASE.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart_convert_nvenc-${{ matrix.artifact }}
          path: dist/smart_convert_nvenc-${{ matrix.artifact }}/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Zip platform bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          for dir in release-assets/smart_convert_nvenc-*; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -r "../../upload/${name}.zip" .)
          done
          ls -lah upload

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          body: |
            Standalone binaries for Windows / Linux / macOS.

            **Still required on the machine:** FFmpeg with `hevc_nvenc` + `av1_nvenc` on `PATH`, plus an NVIDIA GPU for NVENC.

            See `README-RELEASE.txt` inside each zip.
          files: upload/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
