[project]
name = "smart-convert-nvenc"
dynamic = ["version"]
description = "Compress video course archives with NVIDIA NVENC (HEVC vs AV1 sample race)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
]

[project.scripts]
smart-convert = "smart_convert_nvenc.cli:main"
smart-convert-course = "smart_convert_nvenc.course_cli:main"
smart-convert-duplicates = "smart_convert_nvenc.duplicates_cli:main"
smart-convert-gui = "smart_convert_nvenc.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/smart_convert_nvenc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_convert_nvenc"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
release = [
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["smart_convert_nvenc"]
omit = [
    "*/smart_convert_nvenc/gui.py",
    "*/smart_convert_nvenc/__main__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
