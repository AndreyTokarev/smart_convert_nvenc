[project]
name = "smart-convert-nvenc"
version = "0.1.0"
description = "Compress video course archives with NVIDIA NVENC (HEVC vs AV1 sample race)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
smart-convert = "smart_convert_nvenc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_convert_nvenc"]

[dependency-groups]
dev = []
